"app/chess/piece.py" = "chess/piece.py"
"app/chess/table.py" = "chess/table.py"
"app/chess/engine/__init__.py" = "chess/engine/__init__.py"
"app/chess/engine/canvas.py" = "chess/engine/canvas.py"
"app/chess/engine/coordinates.py" = "chess/engine/coordinates.py"
